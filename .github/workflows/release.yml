name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify version and create release
        run: |
          version="$(gh api \
            -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GH_REPO/contents/package.json?ref=$GITHUB_REF_NAME" |
            jq -er '.version | select(type == "string" and length > 0)')"
          test "$GITHUB_REF_NAME" = "v$version"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
